{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block body %}
<div class="container-fluid">
<div class="row">
<div class="col-sm-5 bg-light text-center shadow-lg mx-auto m-5 p-5">

<h2>Admin Login</h2>

<form id="loginForm">
<input type="email" id="email" class="form-control mb-2" placeholder="Admin Email">
<input type="password" id="password" class="form-control mb-2" placeholder="Password">
<button type="submit" class="btn btn-danger form-control">Login</button>
</form>

<p id="message" class="text-danger mt-2"></p>
<p class="mt-3"><a href="{{ url_for('index') }}">&larr; Back to Home</a></p>

</div>
</div>
</div>
{% endblock %}

{% block scripts %}
<script>

const form = document.getElementById("loginForm");
const msg = document.getElementById("message");

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        msg.innerText = "Enter all fields";
        return;
    }

    // ================= 🔐 REAL BACKEND CHECK =================
    // The 5 hardcoded admin accounts are gone. This now calls
    // POST /api/admin/login, which looks the email up in MySQL,
    // verifies the password hash, and (only for role = 'admin')
    // starts a server-side session.
    const result = await apiRequest("/api/admin/login", "POST", { email, password });

    if (result.success) {
        window.location.href = "{{ url_for('admin_dashboard_page') }}";
    } else {
        msg.innerText = "❌ " + result.message;
    }
});

</script>
{% endblock %}
